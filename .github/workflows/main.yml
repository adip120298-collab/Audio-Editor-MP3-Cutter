name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Siapkan proyek dari ZIP
        run: |
          if [ -f settings.gradle.kts ]; then
            DIR=.
          else
            ZIP=$(ls AudioEditorMP3Cutter_V3_Source.zip 2>/dev/null || ls -t *.zip 2>/dev/null | head -n1)
            [ -n "$ZIP" ] || { echo "Tidak ada file ZIP di root repo"; exit 1; }
            echo "Memakai: $ZIP"
            mkdir -p _src && unzip -q -o "$ZIP" -d _src
            DIR=$(dirname "$(find _src -name settings.gradle.kts | head -n1)")
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: AudioEditor-MP3Cutter-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
